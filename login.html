<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CubeMaster</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/color/48/rubiks-cube.png">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at top right, var(--surface-low) 0%, var(--surface-base) 100%);
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        /* Efeito de fundo sutil */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary-cyan);
            filter: blur(150px);
            opacity: 0.15;
            top: -100px;
            right: -100px;
            z-index: 0;
        }

        .login-container {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px var(--primary-cyan-glow);
            z-index: 1;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header i {
            font-size: 3rem;
            color: var(--primary-cyan);
            filter: drop-shadow(0 0 15px var(--primary-cyan-glow));
            margin-bottom: 1rem;
        }

        .login-header h2 {
            font-size: 2rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-group input {
            width: 100%;
            background-color: var(--surface-low);
            border: 1px solid var(--surface-border);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: all var(--transition);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-cyan);
            box-shadow: 0 0 0 3px var(--primary-cyan-glow);
            background-color: var(--surface-base);
        }

        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }

        .actions-group .btn {
            width: 100%;
            justify-content: center;
            padding: 14px;
            font-size: 1rem;
        }

        .actions-group .btn--ghost {
            border-color: transparent;
            color: var(--text-muted);
        }

        .actions-group .btn--ghost:hover {
            color: var(--text-main);
            background-color: var(--surface-hover);
            border-color: var(--surface-border);
        }

        #message {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            min-height: 20px;
        }
    </style>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://fhsolmqghxbreahgqknl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_cieUk7Cu_zRUg_NBffSYaA_HYQzy4cf';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const msg = document.getElementById('message');
            const btnSignup = document.getElementById('signup-btn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                msg.textContent = 'Autenticando...';
                msg.style.color = 'var(--text-muted)';

                const { error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) {
                    msg.textContent = 'Erro: ' + error.message;
                    msg.style.color = 'var(--danger)';
                } else {
                    msg.textContent = 'Acesso concedido. Iniciando...';
                    msg.style.color = 'var(--primary-cyan)';
                    setTimeout(() => window.location.href = 'index.html', 800);
                }
            });

            btnSignup.addEventListener('click', async () => {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                if (!email || !password) {
                    msg.textContent = 'Preencha e-mail e senha para cadastrar.';
                    msg.style.color = 'var(--warning)';
                    return;
                }

                msg.textContent = 'Criando credenciais...';
                msg.style.color = 'var(--text-muted)';

                const { error } = await supabase.auth.signUp({ email, password });

                if (error) {
                    msg.textContent = 'Erro: ' + error.message;
                    msg.style.color = 'var(--danger)';
                } else {
                    msg.textContent = 'Verifique seu e-mail para confirmar o cadastro.';
                    msg.style.color = 'var(--success)';
                }
            });
        });
    </script>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-cube"></i>
            <h2>CubeMaster</h2>
            <p>Acesse seu painel de alta performance</p>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="cubista@exemplo.com" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="actions-group">
                <button type="submit" class="btn">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
                <button type="button" id="signup-btn" class="btn btn--ghost">
                    Criar nova conta
                </button>
            </div>
        </form>

        <p id="message"></p>
    </div>
</body>

</html>
