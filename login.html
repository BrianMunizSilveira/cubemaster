<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CubeMaster</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/color/48/rubiks-cube.png">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at top right, var(--surface-low) 0%, var(--surface-base) 100%);
        }

        /* Glow de fundo */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary-cyan);
            filter: blur(150px);
            opacity: 0.15;
            top: -100px;
            right: -100px;
            z-index: 0;
            transition: 0.5s;
        }

        body.has-error::before {
            background: var(--danger);
            opacity: 0.2;
        }

        .login-container {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px var(--primary-cyan-glow);
            z-index: 1;
            position: relative;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Feedback de erro */
        .login-container.shake {
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header i {
            font-size: 3rem;
            color: var(--primary-cyan);
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 15px var(--primary-cyan-glow));
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .login-header h2 {
            font-size: 2rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-group input {
            width: 100%;
            background: var(--surface-low);
            border: 1px solid var(--surface-border);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-cyan);
            box-shadow: 0 0 0 3px var(--primary-cyan-glow);
            background: var(--surface-base);
        }

        .input-group input.input-error {
            border-color: var(--danger);
            box-shadow: 0 0 0 3px var(--danger-bg);
        }

        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }

        .actions-group .btn {
            width: 100%;
            justify-content: center;
            padding: 14px;
            font-size: 1rem;
            position: relative;
        }

        .actions-group .btn--ghost {
            border-color: transparent;
            color: var(--text-muted);
        }

        .actions-group .btn--ghost:hover {
            background: var(--surface-hover);
            color: var(--text-main);
            border-color: var(--surface-border);
        }

        /* Loading Spinner */
        .btn.loading {
            color: transparent !important;
            pointer-events: none;
        }

        .btn.loading::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin: -10px 0 0 -10px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: var(--text-dark);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .btn--ghost.loading::after {
            border-color: var(--surface-border);
            border-top-color: var(--primary-cyan);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Mensagens de feedback */
        #message {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            min-height: 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: 0.3s;
        }

        #message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .msg-error {
            color: var(--danger);
        }

        .msg-success {
            color: var(--success);
        }

        .msg-info {
            color: var(--text-muted);
        }

        .msg-warning {
            color: var(--warning);
        }
    </style>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        const supabase = createClient(
            'https://fhsolmqghxbreahgqknl.supabase.co',
            'sb_publishable_cieUk7Cu_zRUg_NBffSYaA_HYQzy4cf'
        );

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const msg = document.getElementById('message');
            const btnLogin = document.getElementById('btn-login');
            const btnSignup = document.getElementById('signup-btn');
            const container = document.querySelector('.login-container');
            const inputEmail = document.getElementById('email');
            const inputPass = document.getElementById('password');

            function feedback(text, type) {
                msg.textContent = text;
                msg.className = `show msg-${type}`;
                inputEmail.classList.remove('input-error');
                inputPass.classList.remove('input-error');

                if (type === 'error') {
                    document.body.classList.add('has-error');
                    container.classList.add('shake');
                    inputEmail.classList.add('input-error');
                    inputPass.classList.add('input-error');
                    setTimeout(() => container.classList.remove('shake'), 500);
                } else {
                    document.body.classList.remove('has-error');
                }
            }

            function toggleLoad(btn, isLoading) {
                btn.classList.toggle('loading', isLoading);
                btn.disabled = isLoading;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                toggleLoad(btnLogin, true);
                feedback('Autenticando...', 'info');

                const { error } = await supabase.auth.signInWithPassword({
                    email: inputEmail.value,
                    password: inputPass.value
                });

                if (error) {
                    toggleLoad(btnLogin, false);
                    feedback('Falha no acesso: ' + error.message, 'error');
                } else {
                    feedback('Acesso concedido. Redirecionando...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 800);
                }
            });

            btnSignup.addEventListener('click', async () => {
                if (!inputEmail.value || !inputPass.value) {
                    return feedback('Preencha e-mail e senha.', 'warning');
                }

                toggleLoad(btnSignup, true);
                feedback('Criando conta...', 'info');

                const { error } = await supabase.auth.signUp({
                    email: inputEmail.value,
                    password: inputPass.value
                });

                toggleLoad(btnSignup, false);

                if (error) feedback('Erro: ' + error.message, 'error');
                else feedback('Conta criada! Verifique seu e-mail.', 'success');
            });
        });
    </script>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-cube"></i>
            <h2>CubeMaster</h2>
            <p>Acesse seu painel de alta performance</p>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="cubista@exemplo.com" required autocomplete="email">
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="actions-group">
                <button type="submit" id="btn-login" class="btn">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
                <button type="button" id="signup-btn" class="btn btn--ghost">
                    Criar nova conta
                </button>
            </div>
        </form>

        <p id="message"></p>
    </div>
</body>

</html>
